name: CI/CD Pipeline

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches: [dev, main]
    types: [closed]

jobs:
  # ============= ТЕСТЫ ПРИ ПУШЕ В FEATURE (В DOCKER) =============
  tests-feature:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine # легковесный Docker контейнер с Node.js 20
    steps:
      - uses: actions/checkout@v4

      # npm уже установлен в контейнере, не нужно ничего настраивать
      - run: npm ci
      - run: npm test
      - run: npm run lint

  # ============= ТЕСТЫ ПОСЛЕ МЕРЖА PR (В DOCKER) =============
  tests-after-merge:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - run: npm ci
      - run: npm test
      - run: npm run lint

  # ============= СБОРКА (В DOCKER) =============
  build:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    needs: tests-after-merge
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - run: npm ci
      - run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.pull_request.base.ref }}
          path: dist/
          retention-days: 1

  # ============= ДЕПЛОЙ НА DEV (БЕЗ DOCKER - НУЖЕН SSH) =============
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'dev'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-dev

      - name: Deploy to dev domain
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "/home/c/cy20187/dev.web-use/public_html/"
          strip_components: 0

  # ============= ДЕПЛОЙ НА PROD (БЕЗ DOCKER - НУЖЕН SSH) =============
  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    environment: production # ручной запуск на прод
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-main

      - name: Deploy to production domain
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "."
          target: "/home/c/cy20187/web-use/public_html/"
          strip_components: 0
