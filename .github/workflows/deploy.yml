name: CI/CD Pipeline

on:
  # Запуск тестов при создании/обновлении Pull Request
  pull_request:
    branches: [dev, master]
    types: [opened, synchronize, reopened]

  # Деплой ПОСЛЕ мержа (когда код попадает в ветку)
  push:
    branches: [master, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================
  # JOB 1: ТЕСТЫ (запускаются на Pull Request)
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run linter (если есть)
        run: npm run lint || echo "No linter configured"

      - name: Run tests (если есть)
        run: npm run test || echo "No tests configured"

      - name: Build project (проверяем, что сборка проходит)
        run: npm run build

  # ============================================
  # JOB 2: ДЕПЛОЙ (запускается ПОСЛЕ мержа)
  # ============================================
  deploy:
    name: Deploy to Hosting
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Timeweb
        run: |
          # Определяем целевой сервер в зависимости от ветки
          if [ "${{ github.ref_name }}" = "master" ]; then
            TARGET_DIR="/home/c/cy20187/web-use/public_html"
            echo "🚀 Deploying to PRODUCTION (web-use.ru)"
          else
            TARGET_DIR="/home/c/cy20187/dev.web-use/public_html"
            echo "🚀 Deploying to DEVELOPMENT (dev.web-use.ru)"
          fi

          # Создаём папку, если её нет
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p $TARGET_DIR"

          # Деплоим
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz --delete \
            --exclude '.git*' \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$TARGET_DIR/
